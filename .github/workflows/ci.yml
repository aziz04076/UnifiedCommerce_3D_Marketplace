name: UnifiedCommerce CI & Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pre-Flight Environment Audit
        run: npm run check:env

      - name: Production Monorepo Build
        run: npm run build

      - name: Start Production Server
        run: npm --prefix apps/web run start &
        env:
          NODE_ENV: production

      - name: Wait for Server Readiness
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Automated Route Smoke Test
        run: npm run smoke
